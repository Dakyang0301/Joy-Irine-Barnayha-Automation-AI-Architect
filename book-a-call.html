<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light"/>
<title>Joy Irine Barnayha | Automation & AI Architect</title>
<meta name="description" content="Automation & AI Architect building GoHighLevel CRM, Make.com workflows, AI voice agents & funnels that run your business on autopilot."/>
<meta property="og:title" content="Joy Irine Barnayha | Automation & AI Architect"/>
<meta property="og:description" content="Automation & AI Architect building GoHighLevel CRM, Make.com workflows, AI voice agents & funnels that run your business on autopilot."/>
<meta property="og:image" content="/images/portfolio-og.png"/>
<meta property="og:type" content="website"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--mg:#8B004B;--mg2:#a8005a;--gold:#edb92e;--bg:#080808;}
html,body{background:#080808;color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
nav{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid rgba(139,0,75,0.3);background:#0f0f0f;}
.back{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.82);transition:color .2s;}
.back:hover{color:var(--mg2);}
.brand{font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;}
.brand span{color:var(--mg2);}
.wrap{max-width:900px;margin:0 auto;padding:50px 20px 70px;text-align:center;}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:12px;}
h1 span{color:var(--mg2);}
p{color:rgba(255,255,255,0.6);font-size:15px;margin-bottom:36px;}
.calendly-inline-widget{min-width:280px;height:700px;border-radius:12px;overflow:hidden;background:#111;}
@media(max-width:600px){nav{padding:0 20px;}}
</style>
</head>
<body>

<nav>
  <a href="/" class="back">&larr; Back to Home</a>
  <div class="brand">Joy Irine <span>Barnayha</span></div>
</nav>

<div class="wrap">
  <h1>Let's Book A <span>Call</span></h1>
  <p>Pick a time that works for you — I'll walk you through how automation can run your business on autopilot.</p>
  <div class="calendly-inline-widget" data-url="https://calendly.com/jirineautomationservices/30min"></div>
</div>

<script>
(function(){
  var va = new URLSearchParams(window.location.search).get('va');
  if (va) {
    var el = document.querySelector('.calendly-inline-widget');
    el.setAttribute('data-url', el.getAttribute('data-url') + '?utm_source=va' + va);
  }
})();
</script>
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>

</body>
</html>
